<title>Rift Tamers</title>
<meta name="description" content="Idle 3D de criaturas geradas por genoma.">
<meta name="theme-color" content="#07030f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;800&family=Orbitron:wght@600;800&display=swap">
<style>
[hidden] { display: none !important; }
:root {
  --bg: #07030f; --glass: rgba(14, 10, 32, 0.62); --glass2: rgba(26, 18, 56, 0.78); --line: rgba(160, 130, 255, 0.28);
  --txt: #ece8ff; --mute: #a49cc8; --neon: #7af7ff; --pink: #ff4fd8; --gold: #ffcf5a; --good: #6dffa8; --bad: #ff5a7a;
  --r: 16px; --font: 'Exo 2', system-ui, sans-serif; --disp: 'Orbitron', 'Exo 2', sans-serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;     /* visual único, escuro por escolha: o neon da Fenda */
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; padding: 0 !important; background: var(--bg); color: var(--txt); font-family: var(--font); overflow: hidden; touch-action: manipulation; }
button { font: inherit; color: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--glass2); border-radius: 12px; padding: 8px 12px; transition: transform .12s, background .2s, border-color .2s, box-shadow .2s; }
button:hover:not(:disabled) { border-color: var(--neon); box-shadow: 0 0 14px rgba(122,247,255,.25); }
button:active:not(:disabled) { transform: scale(.96); }
button:disabled { opacity: .45; cursor: not-allowed; }
button.ghost { background: var(--glass); }
button.primary { background: linear-gradient(135deg, #5b2bff, #ff4fd8); border-color: transparent; font-weight: 800; letter-spacing: .5px; }
button.primary:hover:not(:disabled) { box-shadow: 0 0 22px rgba(255,79,216,.5); }
#stage { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
#vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%); }
#overlay { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }

/* HUD */
#hud { position: fixed; top: 0; left: 0; right: 0; display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; padding: 10px 12px; align-items: start; pointer-events: none; }
#hud > * { pointer-events: auto; }
.res { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--glass); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px 4px 6px; font-weight: 600; font-size: 13px; backdrop-filter: blur(10px); white-space: nowrap; }
.chip i { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 11px; }
.chip small { color: var(--mute); font-weight: 400; font-size: 11px; }
#zone { text-align: center; background: var(--glass); border: 1px solid var(--line); border-radius: var(--r); padding: 6px 16px 8px; backdrop-filter: blur(10px); min-width: 210px; }
#zone-name { font-family: var(--disp); font-size: 12px; letter-spacing: 2px; color: var(--neon); text-transform: uppercase; }
#zone-stage { font-family: var(--disp); font-size: 20px; font-weight: 800; }
#stage-progress { height: 4px; background: rgba(255,255,255,.1); border-radius: 4px; margin-top: 4px; overflow: hidden; }
#stage-progress i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--neon), var(--pink)); transition: width .4s; }
#tide { justify-self: end; background: var(--glass); border: 1px solid var(--line); border-radius: var(--r); padding: 6px 12px; font-size: 12px; text-align: right; backdrop-filter: blur(10px); }
#tide b { display: block; font-family: var(--disp); font-size: 13px; }

/* barras sobre as criaturas */
.unit { position: absolute; transform: translate(-50%, -100%); width: 112px; pointer-events: none; transition: opacity .3s; }
.unit .nm { font-size: 11px; font-weight: 700; text-align: center; text-shadow: 0 1px 3px #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.unit .nm em { font-style: normal; color: var(--mute); font-weight: 400; }
.unit .hp { height: 7px; background: rgba(0,0,0,.6); border-radius: 4px; overflow: hidden; border: 1px solid rgba(255,255,255,.18); margin-top: 2px; }
.unit .hp i { display: block; height: 100%; background: linear-gradient(90deg, #3dff9a, #b8ff5a); transition: width .25s; }
.unit.foe .hp i { background: linear-gradient(90deg, #ff4f6d, #ff9a5a); }
.unit .hp i.mid { background: linear-gradient(90deg, #ffd34a, #ffb347); }
.unit .en { display: flex; gap: 2px; margin-top: 2px; justify-content: center; }
.unit .en b { width: 7px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.15); }
.unit .en b.on { background: var(--neon); box-shadow: 0 0 6px var(--neon); }
.unit .st { font-size: 9px; text-align: center; color: var(--gold); min-height: 11px; }
.unit.boss .nm { color: var(--gold); }
.unit.dead { opacity: 0; }
.pop { position: absolute; font-family: var(--disp); font-weight: 800; font-size: 18px; pointer-events: none; text-shadow: 0 2px 6px #000, 0 0 12px currentColor; animation: pop 1s ease-out forwards; white-space: nowrap; }
.pop.crit { font-size: 26px; color: var(--gold); }
.pop.super { color: #ff8a5a; }
.pop.weak { color: #9aa4c8; font-size: 15px; }
.pop.heal { color: var(--good); }
.pop.miss, .pop.status { color: #d6d0ff; font-size: 13px; }
.pop.dot { color: #e07aff; font-size: 14px; }
@keyframes pop { 0% { transform: translate(-50%, 0) scale(.6); opacity: 0; } 15% { transform: translate(-50%, -14px) scale(1.15); opacity: 1; } 100% { transform: translate(-50%, -60px) scale(1); opacity: 0; } }

/* barra de batalha */
#battle-bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(78px + var(--safe-b)); display: flex; gap: 8px; align-items: center; }
#battle-bar .ghost { min-width: 46px; height: 42px; font-family: var(--disp); font-size: 12px; backdrop-filter: blur(10px); }
#btn-push.on { border-color: var(--good); color: var(--good); }
#btn-sync { position: relative; width: 76px; height: 76px; border-radius: 50%; padding: 0; background: radial-gradient(circle, #1d1446, #0b0820); font-family: var(--disp); font-weight: 800; font-size: 13px; letter-spacing: 1px; }
#btn-sync svg { position: absolute; inset: 0; transform: rotate(-90deg); }
#btn-sync .track { fill: none; stroke: rgba(255,255,255,.1); stroke-width: 7; }
#btn-sync .fill { fill: none; stroke: url(#g) var(--neon); stroke: var(--neon); stroke-width: 7; stroke-linecap: round; stroke-dasharray: 276.5; stroke-dashoffset: 276.5; transition: stroke-dashoffset .2s; filter: drop-shadow(0 0 6px var(--neon)); }
#btn-sync.ready { animation: pulse 1s infinite; color: var(--neon); }
#btn-sync span { position: relative; }
@keyframes pulse { 50% { box-shadow: 0 0 30px rgba(122,247,255,.8); } }

/* abas */
#tabs { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; gap: 4px; padding: 6px 8px calc(6px + var(--safe-b)); background: linear-gradient(0deg, rgba(7,3,15,.95), rgba(7,3,15,.6)); backdrop-filter: blur(12px); border-top: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
#tabs::-webkit-scrollbar { display: none; }
#tabs button { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 62px; padding: 6px 8px; background: transparent; border-color: transparent; font-size: 11px; color: var(--mute); position: relative; }
#tabs button b { font-size: 18px; line-height: 1; }
#tabs button.on { color: var(--txt); background: var(--glass2); border-color: var(--line); }
#tabs button .dot { position: absolute; top: 4px; right: 10px; width: 8px; height: 8px; border-radius: 50%; background: var(--pink); box-shadow: 0 0 8px var(--pink); }

/* painel */
#panel { position: fixed; right: 12px; top: 84px; bottom: calc(72px + var(--safe-b)); width: min(440px, calc(100vw - 24px)); background: var(--glass); border: 1px solid var(--line); border-radius: 20px; backdrop-filter: blur(18px); display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.5); animation: slide .25s ease-out; }
@keyframes slide { from { transform: translateX(30px); opacity: 0; } }
.panel-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px 6px; }
.panel-head h2 { margin: 0; font-family: var(--disp); font-size: 15px; letter-spacing: 1.5px; text-transform: uppercase; }
#panel-body { overflow-y: auto; padding: 4px 14px 16px; flex: 1; }
@media (max-width: 720px) {
  #hud { grid-template-columns: 1fr auto; }
  #zone { grid-column: 1 / -1; grid-row: 1; justify-self: center; min-width: 0; padding: 4px 12px 6px; }
  #zone-stage { font-size: 17px; }
  .res { grid-row: 2; }
  #tide { grid-row: 2; }
  #panel { left: 8px; right: 8px; width: auto; top: auto; height: min(68vh, 620px); bottom: calc(66px + var(--safe-b)); animation-name: up; }
  @keyframes up { from { transform: translateY(30px); opacity: 0; } }
  .chip { font-size: 12px; padding: 3px 8px 3px 4px; }
  #tabs { justify-content: flex-start; }
}
body.panel-open #battle-bar { opacity: 0; pointer-events: none; }
@media (min-width: 721px) { body.panel-open #battle-bar { opacity: 1; pointer-events: auto; left: calc((100vw - 452px) / 2); } }

/* cartões */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.card { position: relative; background: var(--glass2); border: 1px solid var(--line); border-radius: 14px; padding: 6px; text-align: center; cursor: pointer; transition: transform .15s, border-color .2s; }
.card:hover { transform: translateY(-2px); border-color: var(--neon); }
.card img { width: 100%; aspect-ratio: 1; display: block; border-radius: 10px; background: radial-gradient(circle at 50% 40%, rgba(255,255,255,.08), transparent 70%); }
.card .n { font-weight: 700; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .m { font-size: 11px; color: var(--mute); }
.card.sel { border-color: var(--pink); box-shadow: 0 0 0 2px var(--pink) inset; }
.card.inteam::after { content: 'EQUIPE'; position: absolute; top: 6px; left: 6px; font-size: 9px; font-weight: 800; background: var(--neon); color: #000; padding: 1px 5px; border-radius: 4px; }
.card .lock { position: absolute; top: 6px; right: 6px; font-size: 12px; }
.prism { background: linear-gradient(120deg, #ff6ad5, #c774e8, #ad8cff, #8795e8, #94d0ff, #6dffd8, #ffe66d); -webkit-background-clip: text; background-clip: text; color: transparent; animation: hue 3s linear infinite; }
@keyframes hue { to { filter: hue-rotate(360deg); } }
.types { display: inline-flex; gap: 3px; justify-content: center; margin: 2px 0; }
.type { font-size: 9px; font-weight: 800; padding: 1px 6px; border-radius: 6px; color: #10061e; text-transform: uppercase; letter-spacing: .3px; }
.rar { font-size: 10px; font-weight: 800; letter-spacing: .5px; }
.row { display: flex; gap: 8px; align-items: center; justify-content: space-between; padding: 10px; background: var(--glass2); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 8px; }
.row h4 { margin: 0 0 2px; font-size: 14px; }
.row p { margin: 0; font-size: 12px; color: var(--mute); }
.row .lv { font-family: var(--disp); font-size: 11px; color: var(--neon); }
.row button { white-space: nowrap; min-width: 92px; }
.section-title { font-family: var(--disp); font-size: 11px; letter-spacing: 2px; color: var(--mute); text-transform: uppercase; margin: 14px 0 8px; }
.note { font-size: 12px; color: var(--mute); line-height: 1.45; }
.big { font-family: var(--disp); font-size: 28px; font-weight: 800; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.filters button { padding: 5px 10px; font-size: 12px; }
.filters button.on { border-color: var(--neon); color: var(--neon); }
.bars { display: grid; grid-template-columns: 38px 1fr 44px; gap: 4px 8px; align-items: center; font-size: 12px; }
.bars .b { height: 6px; background: rgba(255,255,255,.1); border-radius: 3px; overflow: hidden; }
.bars .b i { display: block; height: 100%; background: linear-gradient(90deg, var(--neon), var(--pink)); }
.moves { display: grid; gap: 6px; margin-top: 10px; }
.move { display: flex; justify-content: space-between; padding: 6px 10px; border-radius: 10px; background: rgba(255,255,255,.05); font-size: 12px; }
.dex-cell { aspect-ratio: 1; border-radius: 12px; background: var(--glass2); border: 1px solid var(--line); display: grid; place-items: center; overflow: hidden; position: relative; }
.dex-cell img { width: 100%; height: 100%; object-fit: cover; }
.dex-cell.unk { color: var(--mute); font-family: var(--disp); font-size: 22px; }
.dex-cell.unk.seen { color: #fff; filter: none; }
.dex-cell small { position: absolute; bottom: 2px; left: 0; right: 0; font-size: 9px; text-align: center; text-shadow: 0 1px 2px #000; }
.dexgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 6px; }
.fuse-slots { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; margin-bottom: 12px; }
.fuse-slot { aspect-ratio: 1; border: 2px dashed var(--line); border-radius: 16px; display: grid; place-items: center; overflow: hidden; color: var(--mute); font-size: 12px; text-align: center; cursor: pointer; }
.fuse-slot img { width: 100%; }
.fuse-plus { font-family: var(--disp); font-size: 22px; color: var(--pink); }
.relics { display: flex; flex-wrap: wrap; gap: 6px; }
.relic { font-size: 11px; padding: 4px 8px; border-radius: 8px; background: rgba(255,79,216,.15); border: 1px solid rgba(255,79,216,.4); }

/* modal */
#modal { position: fixed; inset: 0; background: rgba(3,1,10,.72); backdrop-filter: blur(6px); display: grid; place-items: center; z-index: 20; padding: 16px; }
.modal-card { width: min(560px, 100%); max-height: 90vh; overflow-y: auto; background: var(--glass2); border: 1px solid var(--line); border-radius: 22px; padding: 18px; box-shadow: 0 30px 80px rgba(0,0,0,.6); animation: zoom .25s ease-out; }
@keyframes zoom { from { transform: scale(.92); opacity: 0; } }
.modal-card h2 { font-family: var(--disp); margin: 0 0 6px; font-size: 18px; letter-spacing: 1px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 14px; }
.starters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
.starters .card img { aspect-ratio: 1; }
.detail { display: grid; grid-template-columns: 160px 1fr; gap: 14px; }
@media (max-width: 520px) { .detail { grid-template-columns: 1fr; } .detail img { max-width: 180px; margin: 0 auto; } }
.detail img { width: 100%; border-radius: 16px; background: radial-gradient(circle at 50% 40%, rgba(255,255,255,.1), transparent 70%); }
.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 8px 0; }
.stats-grid div { background: rgba(255,255,255,.05); border-radius: 10px; padding: 6px; text-align: center; font-size: 11px; color: var(--mute); }
.stats-grid b { display: block; color: var(--txt); font-size: 14px; }
.report { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.report div { background: rgba(255,255,255,.05); border-radius: 12px; padding: 10px; }
.report b { display: block; font-family: var(--disp); font-size: 18px; }
.report small { color: var(--mute); }

/* log e toasts */
#log { position: fixed; left: 12px; bottom: calc(150px + var(--safe-b)); width: min(360px, 60vw); display: flex; flex-direction: column-reverse; gap: 4px; pointer-events: none; mask-image: linear-gradient(0deg, #000 60%, transparent); }
#log div { font-size: 12px; background: rgba(7,3,15,.55); border-left: 3px solid var(--neon); padding: 4px 8px; border-radius: 6px; animation: fadein .3s; }
#log div.good { border-color: var(--good); } #log div.prism { border-color: var(--pink); } #log div.bad { border-color: var(--bad); }
@media (max-width: 720px) { #log { display: none; } }
#toasts { position: fixed; top: 96px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; align-items: center; z-index: 15; pointer-events: none; }
.toast { display: flex; align-items: center; gap: 10px; background: var(--glass2); border: 1px solid var(--line); border-radius: 16px; padding: 6px 14px 6px 6px; backdrop-filter: blur(12px); animation: toast 3.6s ease forwards; box-shadow: 0 10px 30px rgba(0,0,0,.5); max-width: calc(100vw - 32px); }
.toast img { width: 46px; height: 46px; border-radius: 10px; }
.toast b { display: block; font-size: 13px; } .toast small { color: var(--mute); font-size: 11px; }
.toast.prism { border-color: var(--pink); box-shadow: 0 0 30px rgba(255,79,216,.5); }
@keyframes toast { 0% { transform: translateY(-14px); opacity: 0; } 8%, 85% { transform: none; opacity: 1; } 100% { transform: translateY(-10px); opacity: 0; } }
@keyframes fadein { from { opacity: 0; transform: translateX(-8px); } }

/* boot */
#boot { position: fixed; inset: 0; background: radial-gradient(circle at 50% 40%, #2a0d4a, #07030f 70%); display: grid; place-content: center; text-align: center; z-index: 30; transition: opacity .6s; }
#boot.gone { opacity: 0; pointer-events: none; }
#boot .logo { font-family: var(--disp); font-weight: 800; font-size: clamp(44px, 12vw, 96px); line-height: .95; letter-spacing: 6px; background: linear-gradient(120deg, var(--neon), var(--pink), var(--gold)); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 30px rgba(255,79,216,.4)); }
#boot .sub { color: var(--mute); margin-top: 12px; letter-spacing: 3px; font-size: 12px; text-transform: uppercase; }
#boot .bar { width: 220px; height: 3px; background: rgba(255,255,255,.1); margin: 16px auto 0; border-radius: 3px; overflow: hidden; }
#boot .bar i { display: block; height: 100%; width: 40%; background: linear-gradient(90deg, var(--neon), var(--pink)); animation: load 1.2s infinite ease-in-out; }
@keyframes load { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
.err { padding: 20px; color: var(--bad); }
@media (max-width: 720px) { .grid { grid-template-columns: repeat(3, 1fr); gap: 6px; } .card { padding: 4px; } .card .n { font-size: 11px; } .card .m { font-size: 10px; } }

/* objetivo guiado e faixa de anúncio */
#goal { position: fixed; left: 50%; transform: translateX(-50%); top: 86px; font-size: 12px; background: var(--glass); border: 1px solid var(--line); border-radius: 999px; padding: 4px 14px; backdrop-filter: blur(10px); white-space: nowrap; max-width: calc(100vw - 24px); overflow: hidden; text-overflow: ellipsis; }
#goal small { color: var(--neon); font-family: var(--disp); font-size: 10px; letter-spacing: 1.5px; margin-right: 6px; text-transform: uppercase; }
#goal b { color: var(--gold); margin-left: 4px; }
#goal i { position: absolute; left: 0; bottom: 0; height: 2px; background: linear-gradient(90deg, var(--neon), var(--pink)); }
@media (max-width: 720px) { #goal { top: auto; bottom: calc(160px + var(--safe-b)); } }
body.panel-open #goal { display: none; }
#banner { position: fixed; left: 0; right: 0; top: 34%; text-align: center; pointer-events: none; z-index: 12; }
#banner b { display: block; font-family: var(--disp); font-size: clamp(30px, 7vw, 64px); letter-spacing: 8px; text-shadow: 0 0 30px currentColor, 0 4px 12px #000; }
#banner small { display: block; font-size: 14px; letter-spacing: 3px; color: var(--txt); text-transform: uppercase; text-shadow: 0 2px 6px #000; }
#banner.show { animation: banner 2.6s ease forwards; }
@keyframes banner { 0% { opacity: 0; transform: scale(1.4); letter-spacing: 30px; } 12% { opacity: 1; transform: none; } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-20px); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
button:focus-visible { outline: 2px solid var(--neon); outline-offset: 2px; }

/* Mapa de Caça */
body.hunting #battle-bar, body.hunting #goal, body.hunting #overlay .unit, body.hunting #log { display: none; }
#tabs .hunt-tab b { color: var(--gold); }
#hunt-hud { position: fixed; top: 84px; left: 50%; transform: translateX(-50%); display: grid; gap: 6px; justify-items: center; width: min(560px, calc(100vw - 24px)); pointer-events: none; }
#hunt-hud > * { pointer-events: auto; }
#hunt-hud .hz { display: flex; align-items: center; gap: 10px; background: var(--glass); border: 1px solid var(--line); border-radius: 14px; padding: 4px 6px; backdrop-filter: blur(10px); text-align: center; }
#hunt-hud .hz small { display: block; font-size: 10px; color: var(--mute); letter-spacing: 1px; text-transform: uppercase; }
#hunt-hud .hz b { font-family: var(--disp); font-size: 13px; }
#hunt-hud .hz button { padding: 4px 10px; }
#hunt-hud .hteam { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
#hunt-hud .hteam span { position: relative; overflow: hidden; font-size: 11px; background: var(--glass); border: 1px solid var(--line); border-radius: 8px; padding: 2px 8px 4px; min-width: 70px; text-align: center; }
#hunt-hud .hteam span i { position: absolute; left: 0; bottom: 0; height: 3px; }
#hunt-hud .hteam .horbs { color: #ff8ab0; font-weight: 700; }
#hunt-hud .hhint { font-size: 11px; color: var(--mute); background: rgba(7,3,15,.5); padding: 2px 10px; border-radius: 8px; text-align: center; }
#joy { position: fixed; left: max(24px, env(safe-area-inset-left, 0px)); bottom: calc(96px + var(--safe-b)); width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,.07); border: 2px solid var(--line); touch-action: none; backdrop-filter: blur(6px); }
#joy i { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff, var(--neon)); box-shadow: 0 0 18px var(--neon); opacity: .85; }
#flash { position: fixed; inset: 0; pointer-events: none; z-index: 25; opacity: 0; background: repeating-linear-gradient(0deg, #fff 0 6px, #000 6px 12px); }
#flash.go { animation: flash .55s steps(6) forwards; }
@keyframes flash { 0%, 33%, 66% { opacity: .9; } 16%, 50%, 83% { opacity: 0; } 100% { opacity: 0; } }
#wild-ui { position: fixed; inset: 0; pointer-events: none; z-index: 8; }
#wild-ui > * { pointer-events: auto; }
.wbox { position: absolute; width: min(300px, 46vw); background: var(--glass2); border: 1px solid var(--line); border-radius: 14px; padding: 8px 12px; backdrop-filter: blur(12px); box-shadow: 0 10px 30px rgba(0,0,0,.4); }
.wbox.foe { top: 96px; right: max(16px, env(safe-area-inset-right, 0px)); }
.wbox.me { left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(240px + var(--safe-b)); }
.wname { font-weight: 800; font-size: 15px; display: flex; justify-content: space-between; gap: 6px; }
.wname em { font-style: normal; color: var(--mute); font-weight: 600; font-family: var(--disp); font-size: 12px; }
.wst { font-size: 9px; background: var(--pink); color: #000; padding: 1px 5px; border-radius: 4px; font-weight: 800; }
.wtypes { display: flex; gap: 4px; align-items: center; margin: 2px 0 4px; }
.whp { display: flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 800; color: var(--gold); }
.whp div { flex: 1; height: 8px; background: rgba(0,0,0,.5); border-radius: 4px; overflow: hidden; border: 1px solid rgba(255,255,255,.15); }
.whp i { display: block; height: 100%; transition: width .45s ease, background .3s; }
.whpn { text-align: right; font-family: var(--disp); font-size: 12px; margin-top: 2px; font-variant-numeric: tabular-nums; }
#wpanel { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(76px + var(--safe-b)); width: min(760px, calc(100vw - 24px)); display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: var(--glass2); border: 1px solid var(--line); border-radius: 18px; padding: 10px; backdrop-filter: blur(14px); }
#wtext { font-size: 15px; line-height: 1.4; padding: 6px 8px; min-height: 64px; display: flex; align-items: center; }
#wmenu { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.wb { font-family: var(--disp); font-size: 13px; font-weight: 800; letter-spacing: 1px; padding: 12px 8px; text-align: left; }
.wb small { display: block; font-family: var(--font); font-size: 10px; font-weight: 600; letter-spacing: 0; color: var(--mute); }
.wb.fight { background: linear-gradient(135deg, #ff4f6d55, #ff4f6d22); }
.wb.orb { background: linear-gradient(135deg, #ff4fd855, #ff4fd822); }
.wb.party { background: linear-gradient(135deg, #6dffa855, #6dffa822); }
.wb.run { background: linear-gradient(135deg, #7af7ff55, #7af7ff22); }
.wb.mv { border-left: 4px solid var(--tc); font-family: var(--font); letter-spacing: 0; }
@media (max-width: 720px) {
  #hunt-hud { top: 70px; }
  #hunt-hud .hhint { animation: fadeout 1s 7s forwards; }
  @keyframes fadeout { to { opacity: 0; visibility: hidden; } }
  #wpanel { grid-template-columns: 1fr; bottom: calc(66px + var(--safe-b)); }
  #wtext { min-height: 44px; font-size: 14px; }
  .wbox.foe { top: 72px; width: 62vw; }
  .wbox.me { bottom: calc(254px + var(--safe-b)); width: 62vw; }
  .wb { padding: 10px 6px; font-size: 12px; }
}
